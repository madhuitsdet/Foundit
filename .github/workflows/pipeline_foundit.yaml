name: Selenium Pytest CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  # This adds the daily trigger
  schedule:
    # Example: Runs at 02:00 UTC (7:30 AM IST) every day
    - cron: '0 14 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # Add this step to ensure Firefox/Geckodriver are ready
    - name: Setup Firefox
      uses: browser-actions/setup-firefox@v1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Ensure requirements.txt is in the root folder
        pip install -r requirements.txt

    - name: Run Tests
      env:
        # This tells Python to include the current directory in its search path
        PYTHONPATH: ${{ github.workspace }}
      # Added --headless=new and corrected the file m
      run: |
        pytest FounditAutomation/tests/test_foundit_parameterized.py --html=reports.html --self-contained-html --junitxml=report.xml -v --capture=tee-sys

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: report.xml

    #        pytest FounditAutomation/tests/test_foundit_parameterized.py --junitxml=report.xml -v --capture=tee-sys